name: Android CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        if: hashFiles('gradlew') != ''
      - name: Gate (placeholder until the project has a gradle build)
        run: |
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew test $( [ -d app ] && echo assembleDebug ) --no-daemon --stacktrace
          else echo "no gradle project yet: nothing to gate"; fi
